name: Production Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build the React frontend
  # ──────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: https://atsense.online/api
          VITE_API_BASE_URL: https://atsense.online/api

      # Vite 5 uses fast-glob with dot:false — dotfiles like .htaccess are NOT
      # copied from public/ to dist/ automatically. Force-copy it here.
      - name: Copy .htaccess into dist (Vite 5 dotfile fix)
        run: cp frontend/public/.htaccess frontend/dist/.htaccess

      - name: Verify dist contents (debug)
        run: ls -la frontend/dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1
          include-hidden-files: true

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 — Prepare the Laravel backend (Composer install, no dev)
  # ──────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend (Laravel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, xml, curl, zip, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies (production)
        run: |
          cd backend
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --prefer-dist

      - name: Verify backend .htaccess exists (debug)
        run: ls -la backend/.htaccess backend/index.php

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/
          retention-days: 1
          include-hidden-files: true

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy (depends on both build jobs passing)
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to cPanel (atsense.online)
    runs-on: ubuntu-latest
    needs: [ build-frontend, build-backend ]
    environment: production

    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-dist/

      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./backend-build/

      - name: Verify downloaded artifacts (debug)
        run: |
          echo "=== Frontend dist ==="
          ls -la ./frontend-dist/
          echo "=== Backend build (root) ==="
          ls -la ./backend-build/

      # ── Deploy React SPA → domain root ──────────────────────────────────
      - name: Sync Frontend → /atsense.online/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend-dist/
          server-dir: /atsense.online/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 120000
          exclude: |
            **/.git*
            **/.DS_Store

      # ── Deploy Laravel → /api subdirectory ──────────────────────────────
      - name: Sync Backend → /atsense.online/api/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend-build/
          server-dir: /atsense.online/api/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 120000
          exclude: |
            **/.git*
            **/.env
            **/node_modules/**
            **/tests/**
            **/phpunit.xml
            **/.editorconfig
