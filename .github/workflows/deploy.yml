name: Deploy to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Transfer Files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist,nginx/atsense.conf,backend/package*.json,backend/server.js,backend/src"
          target: "~/atsense"
          strip_components: 0

      - name: Deploy on EC2 (PM2)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Update Nginx config
            sudo cp ~/atsense/nginx/atsense.conf /etc/nginx/conf.d/atsense.conf
            sudo systemctl reload nginx
            
            # Update Backend
            cd ~/atsense/backend
            npm install --production
            pm2 restart atsense-backend || pm2 start server.js --name atsense-backend
