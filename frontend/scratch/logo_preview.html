<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATSense Logo Iterations</title>
<style>
  body {
    background: #0b0f19;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 40px;
    align-items: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    max-width: 1100px;
  }
  .card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 16px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .card-light {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    color: #0f172a;
    border-radius: 16px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-text {
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.03em;
  }
  .brand-text-dark {
    color: #0f172a;
  }
  .brand-text-light {
    color: #ffffff;
  }
</style>
</head>
<body>
  <h1>ATSense Logo Explorations</h1>
  <div class="grid">
    <!-- Concept 1: The Quantum Apex Prism -->
    <div class="card">
      <h3>1. Quantum Apex Prism (Dark)</h3>
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="p1-left" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#4f46e5" />
          </linearGradient>
          <linearGradient id="p1-right" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
          </linearGradient>
          <linearGradient id="p1-center" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="50%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#ec4899" />
          </linearGradient>
          <filter id="p1-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        
        <!-- Ambient back glow -->
        <circle cx="24" cy="24" r="16" fill="#6366f1" opacity="0.25" filter="blur(8px)" />
        
        <!-- Left Wing -->
        <path d="M24 6 L10 38 L16 38 L24 20 Z" fill="url(#p1-left)" />
        
        <!-- Right Wing -->
        <path d="M24 6 L38 38 L32 38 L24 20 Z" fill="url(#p1-right)" />
        
        <!-- Cross Scanning Core -->
        <path d="M14 27 L34 27 L31 32 L17 32 Z" fill="url(#p1-center)" />
        
        <!-- Radar / AI Sensor Eye -->
        <circle cx="24" cy="29.5" r="2.5" fill="#ffffff" filter="url(#p1-glow)" />
        <circle cx="24" cy="29.5" r="4.5" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8" />
        
        <!-- Apex Highlight -->
        <circle cx="24" cy="6" r="1.5" fill="#ffffff" />
      </svg>
      <div class="row">
        <span class="brand-text brand-text-light"><span style="color:#6366f1">AT</span>Sense</span>
      </div>
    </div>

    <!-- Concept 2: The Cybernetic Möbius Hex / Neural A -->
    <div class="card">
      <h3>2. Origami Neural A (Dark)</h3>
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="c2-g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
          <linearGradient id="c2-beam" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
            <stop offset="50%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
          </linearGradient>
        </defs>
        <!-- Soft glow -->
        <rect x="6" y="6" width="36" height="36" rx="12" fill="#6366f1" opacity="0.15" filter="blur(6px)" />
        
        <!-- Dynamic badge frame -->
        <rect x="6" y="6" width="36" height="36" rx="10" fill="#0f172a" stroke="url(#c2-g1)" stroke-width="1.5" />
        
        <!-- Geometric Lettermark -->
        <path d="M24 11 L13 35 H18.5 L21 29.5 H27 L29.5 35 H35 L24 11 Z M24 19.5 L26 25 H22 L24 19.5 Z" fill="url(#c2-g1)" />
        
        <!-- Laser Scan Line -->
        <line x1="8" y1="25" x2="40" y2="25" stroke="url(#c2-beam)" stroke-width="2" stroke-linecap="round" />
        <circle cx="24" cy="25" r="2" fill="#38bdf8" />
      </svg>
      <div class="row">
        <span class="brand-text brand-text-light"><span style="color:#6366f1">AT</span>Sense</span>
      </div>
    </div>

    <!-- Concept 3: The Interlocking Bi-fold Chevron (Modern Linear style) -->
    <div class="card">
      <h3>3. Interlocking Prism Apex (Dark)</h3>
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="c3-left" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
          <linearGradient id="c3-right" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#4f46e5" />
          </linearGradient>
          <linearGradient id="c3-cross" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#a855f7" />
          </linearGradient>
        </defs>
        
        <!-- Layer 1: Left Wing Ribbon -->
        <path d="M24 5 L8 37 L14.5 41 L24 22 L33.5 41 L40 37 L24 5 Z" fill="url(#c3-right)" opacity="0.9" />
        <path d="M24 5 L8 37 L14.5 41 L24 22 Z" fill="url(#c3-left)" />
        
        <!-- Center Floating Sensor Bar -->
        <path d="M16 29 L32 29 L30 33 L18 33 Z" fill="url(#c3-cross)" />
        <circle cx="24" cy="31" r="2" fill="#ffffff" />
      </svg>
      <div class="row">
        <span class="brand-text brand-text-light"><span style="color:#6366f1">AT</span>Sense</span>
      </div>
    </div>

  </div>
</body>
</html>
